/* 实时 DAG：点亮/完成节点 */
function lightNodeByOrder(order, state) {
  document.querySelectorAll("#liveDag .node").forEach(node => {
    if (node.dataset.order === order) {
      node.classList.remove("running", "done");
      node.classList.add(state);
    }
  });
}

/* 从 stream-json 事件提取调度信号并点亮 */
function handleStreamEvent(evt) {
  const type = evt.type;
  if (type === "system" && evt.subtype === "init") {
    setPhase("design");
    appendLog("phase", "· 会话初始化 · 进入设计阶段");
    return;
  }
  if (type === "assistant") {
    const content = (evt.message && evt.message.content) || [];
    for (const c of content) {
      if (!c || typeof c !== "object") continue;
      if (c.type === "tool_use" && c.name === "Agent") {
        const role = c.input && c.input.subagent_type;
        if (role) {
          setPhase("execute");
          // 记下 tool_use_id，等对应的 tool_result 回来时点亮 done
          if (c.id) agentCallRoles.set(c.id, role);
          // 找到角色中文名（通过已加载的 liveData 映射）
          const step = composeState.liveData?.steps?.find(s => s.role === role);
          const cn = step?.role_cn || role;
          const order = step?.order || "";
          appendLog("dispatch", `调度角色 → ${cn}${order ? "（" + order + "）" : ""}`, "调度");
          if (step) lightNodeByOrder(order, "running");
        }
      }
    }
    return;
  }
  if (type === "user") {
    // tool_result：Agent 子代理返回结果——比从叙述文本里正则猜「S1 完成」可靠得多。
    // 遍历结果块，找出对应的 Agent 调用并点亮其节点为 done。
    const content = (evt.message && evt.message.content) || [];
    for (const c of content) {
      if (!c || typeof c !== "object" || c.type !== "tool_result") continue;
      const role = agentCallRoles.get(c.tool_use_id);
      if (role) {
        agentCallRoles.delete(c.tool_use_id);
        const step = composeState.liveData?.steps?.find(s => s.role === role);
        if (step) {
          lightNodeByOrder(step.order, "done");
          appendLog("tool", `角色返回 ← ${step.role_cn || role}（${step.order}）`);
        }
      }
    }
  }
}

function handleLogEvent(payload) {
  const kind = payload.kind;
  if (kind === "phase") {
    appendLog("phase", `· ${payload.text}${payload.model ? " · " + payload.model : ""} ·`);
  } else if (kind === "narrate") {
    appendLog("narrate", payload.text);
    // 从叙述文本里探测 "S<n> ... 完成/成功" 之类的信号，点亮 done
    const m = payload.text.match(/\b(S\d+)\s*(?:完成|成功|收敛|产出)/);
    if (m) lightNodeByOrder(m[1], "done");
  } else if (kind === "dispatch") {
    const order = composeState.liveData?.steps?.find(s => s.role === payload.role)?.order;
    appendLog("dispatch", `调度角色 → ${payload.role_cn || payload.role}${order ? "（" + order + "）" : ""}`, "调度");
    if (order) lightNodeByOrder(order, "running");
  } else if (kind === "wait") {
    appendLog("wait", payload.text || "等待子代理完成…");
  } else if (kind === "tool") {
    appendLog("tool", payload.text);
  } else if (kind === "result") {
    if (payload.ok) {
      const cost = payload.cost ?? 0;
      appendLog("result ok", `✅ 编排完成 · ${payload.turns} 轮 · 成本 $${cost.toFixed(4)}`);
      // 顶栏成本同步展示（此前该元素只被清空、从未填充）
      $("#pCost").textContent = `成本 $${cost.toFixed(4)}`;
    } else {
      appendLog("result fail", `❌ 编排结束（有错误）`);
    }
  } else if (kind === "error") {
    appendLog("error", payload.text || "错误");
  } else if (kind === "raw") {
    appendLog("raw", payload.text);
  }
}

/* 轮询 cases：检测本次编排的 case 目录 + 读取方案 JSON 渲染实时 DAG */
async function pollForCase() {
  if (composeState.liveData) return; // 已渲染，不再轮询
  try {
    const cases = await loadCases();
    // 收集候选目录，两条来源互补：
    // 1. 增量检测：不在 casesBefore 基线里的新目录（常规场景）
    // 2. 时间戳归属：目录名里的 YYYYMMDD-HHMMSS ≥ run 启动时间的已有目录
    //    ——覆盖「刷新恢复」场景：设计已落盘、目录已建，但刷新后它已在基线里
    // 注意：claude 一次运行可能建多个目录（如中途另起炉灶），其中有的只是
    // 没有方案 JSON 的空壳——不能锁定第一个候选，必须逐个尝试，取第一个
    // 能解析出 steps 的目录。
    const candidates = [];
    const seen = new Set();
    for (const c of cases) { // cases 已按目录名倒序（新→旧）
      const isNew = !composeState.casesBefore.has(c.dir);
      const isOwned = !!(composeState.startedAtTs && composeState.runId
        && c.ts && tsToEpoch(c.ts) >= composeState.startedAtTs - 60);
      if ((isNew || isOwned) && !seen.has(c.dir)) {
        candidates.push(c.dir);
        seen.add(c.dir);
      }
    }
    for (const dir of candidates) {
      try {
        const data = await loadCase(dir);
        if (data && data.steps && data.steps.length) {
          composeState.liveCaseDir = dir;
          composeState.liveData = data;
          renderLiveDag(data);
          return;
        }
      } catch (e) { /* 该目录方案还没落盘或解析失败，继续试下一个候选 */ }
    }
    // 暂无可渲染的目录：先记住首个候选，供结束时的存档提示兜底
    if (!composeState.liveCaseDir && candidates.length) {
      composeState.liveCaseDir = candidates[0];
    }
  } catch (e) { /* 忽略轮询错误 */ }
}

// "YYYYMMDD-HHMMSS"（本地时间）-> epoch 秒；格式不符返回 null
function tsToEpoch(ts) {
  const m = ts.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})$/);
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
  return isNaN(d.getTime()) ? null : Math.floor(d.getTime() / 1000);
}

function renderLiveDag(data) {
  $("#dagHint").style.display = "none";
  renderDag(data, "#liveDag", false);
  // 若已有已调度角色，补点亮
  document.querySelectorAll("#liveDag .node").forEach(node => {
    const step = data.steps.find(s => s.role === node.dataset.role);
    if (step && step.status === "success") node.classList.add("done");
  });
}

function startCompose() {
  const input = $("#composeInput");
  const requirement = input.value.trim();
  if (!requirement || composeState.running) return;

  composeState.running = true;
  composeState.done = false;
  composeState.liveData = null;
  composeState.liveCaseDir = null;
  composeState.startedAtTs = Math.floor(Date.now() / 1000);
  agentCallRoles.clear();
  lastEventSeq = 0;
  clearConsole();
  $("#dagHint").style.display = "flex";
  $("#dagHint").querySelector(".spinner").style.display = "block";
  $("#dagHint").querySelector("div:last-child").textContent = "等待架构师设计任务流…";
  $("#liveDag").innerHTML = "";
  $("#liveDot").classList.add("live");
  resetPipeline();
  $("#pCost").textContent = "";
  const btn = $("#composeRunBtn");
  btn.textContent = "编排中…";
  btn.classList.add("running");
  btn.disabled = true;
  input.disabled = true;

  // 记录启动前已有的 case
  loadCases().then(cases => {
    composeState.casesBefore = new Set(cases.map(c => c.dir));

    // 发起编排
    fetch("/api/compose/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ requirement })
    }).then(r => r.json()).then(res => {
      if (res.error) {
        finishCompose(true, res.error);
        return;
      }
      composeState.runId = res.run_id;
      // 写入 URL，刷新后据此恢复日志
      history.replaceState(null, "", `?run_id=${res.run_id}`);
      appendLog("phase", `· 已发起编排 · run ${res.run_id} ·`);
      subscribeEvents(res.run_id);
      // 启动轮询
      composeState.pollTimer = setInterval(pollForCase, 2000);
    }).catch(err => finishCompose(true, "发起失败：" + err.message));
  });
}

function subscribeEvents(runId) {
  const es = new EventSource(`/api/compose/events?run_id=${runId}`);
  composeState.es = es;

  es.onmessage = (msg) => {
    try {
      const event = JSON.parse(msg.data);
      // 跳过回放日志里已消费过的事件（刷新恢复后 SSE 队列可能仍有残留旧事件）
      if (typeof event.seq === "number") {
        if (event.seq <= lastEventSeq) return;
        lastEventSeq = event.seq;
      }
      if (event.event === "lifecycle") {
        if (event.phase === "starting") {
          appendLog("phase", "· claude 进程启动 ·");
        } else if (event.phase === "done") {
          finishCompose(false);
        } else if (event.phase === "error") {
          finishCompose(true, event.payload?.error || `进程退出码 ${event.payload?.exit_code}`);
        }
      } else if (event.event === "stream") {
        handleStreamEvent(event.payload);
      } else if (event.event === "log") {
        handleLogEvent(event.payload);
      }
    } catch (e) { /* 忽略 */ }
  };

  es.onerror = () => {
    // SSE 连接错误：如果尚未 done，视为异常结束
    if (composeState.running && !composeState.done) {
      finishCompose(true, "事件流中断");
    }
  };
}

function finishCompose(isError, errMsg) {
  if (composeState.done) return;
  composeState.done = true;
  composeState.running = false;
  if (composeState.es) { composeState.es.close(); composeState.es = null; }
  if (composeState.pollTimer) { clearInterval(composeState.pollTimer); composeState.pollTimer = null; }

  $("#liveDot").classList.remove("live");
  const btn = $("#composeRunBtn");
  btn.textContent = "开始编排";
  btn.classList.remove("running");
  btn.disabled = false;
  $("#composeInput").disabled = false;

  if (isError) {
    setPhase("error");
    appendLog("error", errMsg || "执行失败");
  } else {
    setPhase("done");
    appendLog("phase", "· 编排流程结束 ·");
  }

  // 兜底：最后再轮询一次，确保抓到新 case
  pollForCase().then(() => {
    if (composeState.liveCaseDir) {
      appendLog("narrate", `📁 已存档到 cases/${composeState.liveCaseDir}`);
      // 刷新左侧列表并高亮新 case
      refreshSidebarHighlight(composeState.liveCaseDir);
    }
    // 若始终没等到任务流数据（无 liveData），把提示恢复为中性状态，避免残留转圈
    if (!composeState.liveData) {
      const hint = $("#dagHint");
      hint.style.display = "flex";
      hint.querySelector(".spinner").style.display = "none";
      hint.querySelector("div:last-child").textContent = "输入需求后，这里将展示任务流";
    }
  });
}

async function refreshSidebarHighlight(dir) {
  const cases = await loadCases();
  renderSidebar(cases);
  const item = document.querySelector(`.case-item[data-dir="${dir}"]`);
  if (item) item.classList.add("active");
}

/* 刷新后恢复：读 URL 的 run_id，回放完整日志 + 恢复状态 */
async function restoreRun(runId) {
  try {
    const res = await fetch(`/api/compose/logs?run_id=${runId}`);
    if (!res.ok) return; // run 不存在（服务器重启 / 从未有此 run）
    const data = await res.json();
    if (data.error) return;

    composeState.runId = data.run_id;
    // 服务端启动时间为准（刷新恢复场景下比本地时钟可靠），用于按时间归属 case 目录
    if (data.started_at) composeState.startedAtTs = data.started_at;
    clearConsole();
    // 回放全量日志；记住最大序号，重连 SSE 后跳过这些旧事件（防止日志重复）
    for (const evt of data.log) {
      if (typeof evt.seq === "number") lastEventSeq = Math.max(lastEventSeq, evt.seq);
      if (evt.event === "lifecycle") {
        if (evt.phase === "starting") {
          appendLog("phase", "· claude 进程启动 ·");
        } else if (evt.phase === "done") {
          // 终态由下方 status 统一处理
        } else if (evt.phase === "error") {
          appendLog("error", evt.payload?.error || `进程退出码 ${evt.payload?.exit_code}`);
        }
      } else if (evt.event === "stream") {
        handleStreamEvent(evt.payload);
      } else if (evt.event === "log") {
        handleLogEvent(evt.payload);
      }
    }

    // 恢复 UI 状态
    if (data.status === "running") {
      // 仍在运行：恢复运行态，重新订阅后续事件
      composeState.running = true;
      composeState.done = false;
      $("#liveDot").classList.add("live");
      $("#composeInput").value = data.requirement || "";
      const btn = $("#composeRunBtn");
      btn.textContent = "编排中…";
      btn.classList.add("running");
      btn.disabled = true;
      $("#composeInput").disabled = true;
      // 启动轮询 + 重新订阅
      loadCases().then(cases => {
        composeState.casesBefore = new Set(cases.map(c => c.dir));
      });
      composeState.pollTimer = setInterval(pollForCase, 2000);
      subscribeEvents(runId);
    } else {
      // 已结束：显示终态
      composeState.running = false;
      composeState.done = true;
      $("#liveDot").classList.remove("live");
      if (data.exit_code === 0) {
        setPhase("done");
        appendLog("phase", "· 编排流程结束 ·");
      } else {
        setPhase("error");
      }
      // 尝试补抓 liveCaseDir 以高亮存档
      pollForCase().then(() => {
        if (composeState.liveCaseDir) {
          appendLog("narrate", `📁 已存档到 cases/${composeState.liveCaseDir}`);
          refreshSidebarHighlight(composeState.liveCaseDir);
        }
        // 恢复运行态时若 hint 仍在转圈（设计未落盘），恢复为中性提示
        if (!composeState.liveData) {
          const hint = $("#dagHint");
          hint.style.display = "flex";
          hint.querySelector(".spinner").style.display = "none";
          hint.querySelector("div:last-child").textContent = "该次编排未产出任务流（可能中途失败或被取消）";
        }
      });
    }
  } catch (e) { /* 恢复失败静默，不打断正常使用 */ }
}

// 页面加载：若 URL 带 run_id，切到编排视图并恢复
(function initRestore() {
  const m = location.search.match(/[?&]run_id=([A-Za-z0-9]+)/);
  if (m) {
    // 切到编排 tab
    const composeTab = document.querySelector('#tabbar .tab[data-view="compose"]');
    if (composeTab) composeTab.click();
    restoreRun(m[1]);
  }
})();

// 输入框回车：Enter 换行，Cmd/Ctrl+Enter 触发编排
$("#composeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey) && !composeState.running) {
    e.preventDefault();
    startCompose();
  }
});
$("#composeRunBtn").addEventListener("click", startCompose);

// 停止按钮（运行中点击取消）
$("#composeRunBtn").addEventListener("dblclick", () => {
  if (composeState.running && composeState.runId) {
    fetch("/api/compose/stop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ run_id: composeState.runId })
    });
    appendLog("wait", "已请求停止编排…（双击停止）");
  }
});
</script>
</body>
